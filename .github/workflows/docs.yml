name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  link-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check relative Markdown links resolve
        run: python scripts/check_doc_links.py

      - name: Check the README's measured numbers still follow from the raw data
        run: |
          pip install -e ".[benchmark]"
          python scripts/generate_report.py --check --skip-reports
